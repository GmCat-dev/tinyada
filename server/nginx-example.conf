# tiny.gmcat.io: TinyADA. Static pages from /var/www/sites/tiny.gmcat.io (the web/ folder),
# API from the gmcat-tinyada service on 127.0.0.1:4199.
#   /                 make a link             /<6 chars>, /@name   the link page (view/index.html)
#   /<code>/overlay   stream overlay          /plus/               TinyADA Plus
#   /api/tiny/...     the service             (its /api/gmcat/event is NOT published: account service on this machine only)
server {
    listen 443 ssl;
    server_name tiny.gmcat.io;

    ssl_certificate /etc/letsencrypt/live/tiny.gmcat.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiny.gmcat.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sites/tiny.gmcat.io;
    error_page 404 /404.html;
    charset utf-8;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/tiny-headers.conf; }
    location ~ "^/(?:plus|view|overlay|receipt)/$" { try_files $uri/index.html =404; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; include /etc/nginx/snippets/tiny-headers.conf; }
    location ~ "^/(?:plus|view|overlay)$" { return 301 $uri/; }

    # the link page (its address names the link, so: not indexed, no referrer sent anywhere)
    location ~ "^/(?:[23456789a-hjkmnp-z]{6}|@[a-z0-9_-]{3,20})/?$" {
        default_type text/html;
        try_files /view/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/tiny-headers.conf;
    }
    # stream overlay (OBS browser source)
    location ~ "^/(?:[23456789a-hjkmnp-z]{6}|@[a-z0-9_-]{3,20})/overlay/?$" {
        default_type text/html;
        try_files /overlay/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/tiny-headers.conf;
    }
    # private payment receipts (no account: this page is the record)
    location ~ "^/receipt/[A-Za-z0-9_-]{8,80}$" {
        default_type text/html;
        try_files /receipt/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/tiny-headers.conf;
    }
    # the GmCat account page loads this in a hidden frame (signed in to TinyADA on this device?)
    location = /session-bridge.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; frame-ancestors https://account.gmcat.io" always;
    }

    location ^~ /api/tiny {
        proxy_pass http://127.0.0.1:4199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location ^~ /js/ { try_files $uri =404; add_header Cache-Control "public, max-age=3600" always; add_header X-Content-Type-Options "nosniff" always; }
    location ^~ /img/ { try_files $uri =404; expires 7d; add_header Cache-Control "public, max-age=604800" always; }
    location ~ "^/(?:brand\.css|site\.css|theme\.js|insights\.js|404\.html|robots\.txt|sitemap\.xml)$" { try_files $uri =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /favicon.ico { try_files /img/tiny-icon.png =404; expires 7d; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name tiny.gmcat.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
